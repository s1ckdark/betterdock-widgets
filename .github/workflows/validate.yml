name: Validate

on:
  pull_request:
  push:
    branches: [main]
  # 서명된 목록은 30일 뒤 만료된다. 주 1회 확인해 만료 7일 전부터 실패로 알린다
  # (메인테이너가 build-index --renew → sign-index로 다시 서명할 때다).
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

env:
  # 앱에 박힌 index 서명 공개키(README와 같다). 비밀키는 CI에 없다.
  INDEX_PUBLIC_KEY: pwO6l6HlEPMEaOxjIrBNZsjC5yPWHJvhQFsfuiZ+DXU=

jobs:
  validate:
    runs-on: macos-26
    steps:
      # 태그는 옮겨질 수 있어 커밋 SHA로 고정한다(v4는 Node 20, v5부터 Node 24 런타임).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Swift 버전
        run: swift --version
      - name: 공식·커뮤니티 경계 회귀 검사
        run: python3 tools/test-market-validation.py
      # PR: 기여자는 index.json을 고치지 않으므로 규칙 검사만 한다.
      - name: 위젯 규칙 검사
        if: github.event_name == 'pull_request'
        run: swift tools/build-index.swift --validate
      # main: 커밋된 index.json이 widgets/와 같고 서명·해시·만료가 맞는지 확인한다.
      # PR을 병합한 직후에는 메인테이너가 서명된 index를 올리기 전까지 실패한다.
      - name: index.json 일치·만료 확인
        if: github.event_name != 'pull_request'
        run: swift tools/build-index.swift --check
      - name: 서명·해시 확인
        if: github.event_name != 'pull_request'
        run: swift tools/verify-index.swift "$INDEX_PUBLIC_KEY"
