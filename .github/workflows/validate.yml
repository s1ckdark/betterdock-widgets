name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  # 앱에 박힌 index 서명 공개키(README와 같다). 비밀키는 CI에 없다.
  INDEX_PUBLIC_KEY: pwO6l6HlEPMEaOxjIrBNZsjC5yPWHJvhQFsfuiZ+DXU=

jobs:
  validate:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Swift 버전
        run: swift --version
      # PR: 기여자는 index.json을 고치지 않으므로 규칙 검사만 한다.
      - name: 위젯 규칙 검사
        if: github.event_name == 'pull_request'
        run: swift tools/build-index.swift --validate
      # main: 커밋된 index.json이 widgets/와 같고 서명·해시가 맞는지 확인한다.
      # PR을 병합한 직후에는 메인테이너가 서명된 index를 올리기 전까지 실패한다.
      - name: index.json 일치 확인
        if: github.event_name == 'push'
        run: swift tools/build-index.swift --check
      - name: 서명·해시 확인
        if: github.event_name == 'push'
        run: swift tools/verify-index.swift "$INDEX_PUBLIC_KEY"
